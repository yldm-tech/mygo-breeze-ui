name: Labels

# Labels pull requests: by the files they change (.github/labeler.yml), by the type of their Conventional Commit title and by their size (.github/scripts/label-pr.sh), which fails on a title that is not a Conventional Commit. pull_request_target runs this workflow as main has it, with a token that may label pull requests from forks too; it checks out main only, never the pull request's code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Title and labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
      - name: Ensure the labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/ensure-labels.sh
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
      - name: Type and size
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/label-pr.sh "$PR"
