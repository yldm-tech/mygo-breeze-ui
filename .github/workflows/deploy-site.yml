name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run site:build
      # The storybook: every widget compiled to WebAssembly, beside the site at /storybook/.
      - run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o website/dist/storybook/app.wasm ./examples/storybook
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" website/dist/storybook/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
