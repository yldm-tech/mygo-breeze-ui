# Weekly updates of the Go module, the Bun workspaces and the workflows' actions, minor and patch updates of each grouped in one pull request. Dependabot titles them as Conventional Commits (chore(deps): ...), which the Labels workflow requires.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # package.json's catalog pins vite to vite-plus's own core through an npm: alias (vite: npm:@voidzero-dev/vite-plus-core@X), which must stay at vite-plus's version and which Dependabot does not move, so a vite-plus bump alone breaks the site's build (#24). Bump vite-plus and the alias together by hand.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/vite-plus-core"
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
