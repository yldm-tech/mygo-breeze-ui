<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breeze UI Storybook</title>
    <meta name="description" content="Every Breeze UI widget for MyGo, drawn as macOS, Windows 11 and GNOME draw their controls, with controls and Go code." />
    <link rel="icon" type="image/svg+xml" href="../mygo-breeze-favicon.svg" />
    <link rel="apple-touch-icon" href="../mygo-breeze-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <meta name="theme-color" content="#f4f5f7" />
    <style>
      html, body { margin: 0; height: 100%; background: #f4f5f7; color: #15171c; font: 14px Inter, system-ui, sans-serif; }
      .site-nav { position: fixed; z-index: 10; inset: 0 0 auto; height: 64px; display: flex; align-items: center; border-bottom: 1px solid #e2e4e9; background: rgba(244,245,247,.92); backdrop-filter: blur(16px); }
      .site-nav-inner { width: min(1200px, calc(100% - 48px)); height: 100%; margin: 0 auto; display: flex; align-items: center; gap: 28px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #15171c; font-size: 17px; font-weight: 700; text-decoration: none; white-space: nowrap; }
      .brand-mark { width: 28px; height: 28px; }
      .nav-links { display: flex; align-items: center; gap: 24px; color: #555c69; }
      .nav-links a { padding: 7px 2px; color: inherit; text-decoration: none; }
      .nav-links a:hover { color: #0b7a63; }
      .nav-links a.active { color: #0b7a63; font-weight: 600; }
      .nav-github { margin-left: auto; color: #555c69; text-decoration: none; }
      .nav-github:hover { color: #15171c; }
      #mygo { position: fixed; inset: 64px 0 0; }
      #loading { position: fixed; inset: 64px 0 0; display: grid; place-items: center; color: #555c69; }
      @media (max-width: 680px) { .site-nav-inner { width: calc(100% - 34px); gap: 16px; } .nav-links { gap: 12px; } .nav-links a.docs, .nav-github { display: none; } }
    </style>
    <script src="wasm_exec.js"></script>
    <script>
      const storybookLanguages = ["zh", "ja", "ko", "es", "fr", "de", "en"];
      const requestedLocale = new URLSearchParams(window.location.search).get("lang") || "";
      const preferredLocales = requestedLocale ? [requestedLocale, ...(navigator.languages || [])] : (navigator.languages?.length ? navigator.languages : [navigator.language || "en"]);
      const storybookLocale = preferredLocales
        .map((language) => language.toLowerCase().split("-")[0])
        .find((language) => storybookLanguages.includes(language)) || "en";
      const storybookChrome = {
        en: { title: "Breeze UI Storybook", docs: "Docs", storybook: "Storybook", cli: "CLI & MCP", github: "GitHub", loading: "Loading the storybook…", error: "The storybook could not load: " },
        zh: { title: "Breeze UI 故事书", docs: "文档", storybook: "Storybook", cli: "CLI 与 MCP", github: "GitHub", loading: "正在加载故事书…", error: "故事书加载失败：" },
        ja: { title: "Breeze UI ストーリーブック", docs: "ドキュメント", storybook: "Storybook", cli: "CLI と MCP", github: "GitHub", loading: "ストーリーブックを読み込んでいます…", error: "ストーリーブックの読み込みに失敗しました：" },
        ko: { title: "Breeze UI 스토리북", docs: "문서", storybook: "Storybook", cli: "CLI 및 MCP", github: "GitHub", loading: "스토리북을 불러오는 중…", error: "스토리북을 불러오지 못했습니다: " },
        es: { title: "Storybook de Breeze UI", docs: "Documentación", storybook: "Storybook", cli: "CLI y MCP", github: "GitHub", loading: "Cargando Storybook…", error: "No se pudo cargar Storybook: " },
        fr: { title: "Storybook Breeze UI", docs: "Documentation", storybook: "Storybook", cli: "CLI et MCP", github: "GitHub", loading: "Chargement de Storybook…", error: "Le chargement de Storybook a échoué : " },
        de: { title: "Breeze UI Storybook", docs: "Dokumentation", storybook: "Storybook", cli: "CLI & MCP", github: "GitHub", loading: "Storybook wird geladen …", error: "Storybook konnte nicht geladen werden: " },
      };
      const storybookCopy = storybookChrome[storybookLocale];
      window.__MYGO_STORYBOOK_LOCALE__ = storybookLocale === "zh" ? "zh-Hans" : storybookLocale;
      document.documentElement.lang = storybookLocale === "zh" ? "zh-CN" : storybookLocale;
      document.title = storybookCopy.title;
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("app.wasm?v=storybook-20261107-runtime-locale"), go.importObject)
        .then((r) => {
          document.getElementById("loading").remove();
          go.run(r.instance);
        })
        .catch((err) => {
          document.getElementById("loading").textContent = storybookCopy.error + err;
        });
    </script>
  </head>
  <body>
    <header class="site-nav">
      <div class="site-nav-inner">
        <a class="brand" href="../" aria-label="Breeze UI home">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="4" y="6" width="36" height="28" rx="9" fill="#A6E1CD" />
            <rect x="14" y="17" width="36" height="28" rx="4" fill="#3FAE8C" />
            <rect x="24" y="28" width="36" height="28" rx="7" fill="#0B7A63" />
            <circle cx="31" cy="35" r="1.8" fill="#fff" />
            <circle cx="37" cy="35" r="1.8" fill="#fff" fill-opacity=".7" />
            <circle cx="43" cy="35" r="1.8" fill="#fff" fill-opacity=".45" />
          </svg>
          Breeze UI
        </a>
        <nav class="nav-links" aria-label="Breeze UI">
          <a class="docs" href="../docs/" data-i18n="docs">Docs</a>
          <a class="active" href="./" aria-current="page" data-i18n="storybook">Storybook</a>
          <a href="../cli-mcp/" data-i18n="cli">CLI &amp; MCP</a>
        </nav>
        <a class="nav-github" href="https://github.com/yldm-tech/mygo-breeze-ui" data-i18n="github">GitHub</a>
      </div>
    </header>
    <div id="loading" data-i18n="loading">Loading the storybook…</div>
    <script>
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.dataset.i18n;
        if (key && storybookCopy[key]) el.textContent = storybookCopy[key];
      });
    </script>
    <div id="mygo"></div>
  </body>
</html>
